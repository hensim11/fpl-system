[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-ai-platform"
version = "0.1.0"
description = "Foundation and data ingestion pipeline for an FPL analytics platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "FPL AI Platform contributors"}]
dependencies = []

[project.scripts]
fpl-ingest = "fpl_ai.cli:main"

[tool.setuptools.packages.find]
include = ["fpl_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
