[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-ai-platform"
version = "0.1.0"
description = "Foundation and data ingestion pipeline for an FPL analytics platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "FPL AI Platform contributors"}]
dependencies = [
    "scikit-learn==1.7.2",
    "numpy==2.3.3",
    "scipy==1.16.2",
    "joblib==1.5.2",
    "threadpoolctl==3.6.0",
]

[project.scripts]
fpl-ingest = "fpl_ai.cli:main"

[tool.setuptools.packages.find]
include = ["fpl_ai*"]

[tool.setuptools.package-data]
fpl_ai = ["historical_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
